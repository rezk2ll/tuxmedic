name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/*.tar.gz
          retention-days: 7

  # Installs the native package on each distro and runs every check. A check
  # that crashes, or output that isn't valid JSON, fails the job.
  distros:
    needs: packages
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:stable", install: "apt-get install -y ./pkg/*_amd64.deb" }
          - { image: "ubuntu:24.04", install: "apt-get install -y ./pkg/*_amd64.deb" }
          - { image: "fedora:latest", install: "dnf install -y ./pkg/*.x86_64.rpm" }
          - { image: "opensuse/tumbleweed", install: "zypper --non-interactive install --allow-unsigned-rpm ./pkg/*.x86_64.rpm" }
          - { image: "archlinux:latest", install: "pacman -U --noconfirm ./pkg/*-x86_64.pkg.tar.zst" }
          - { image: "alpine:latest", install: "apk add --allow-untrusted ./pkg/*_x86_64.apk" }
          - { image: "ghcr.io/void-linux/void-glibc:latest", install: "tar -xzf ./pkg/*_linux_amd64.tar.gz -C /usr/local/bin tuxmedic" }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: pkg
      - name: Install
        run: ${{ matrix.install }}
      - name: Run every check
        run: |
          set +e
          tuxmedic check --verbose > out.txt 2>&1
          code=$?
          cat out.txt
          [ "$code" -le 1 ] || { echo "unexpected exit code $code"; exit 1; }
          if grep -q "This check crashed" out.txt; then exit 1; fi
      - name: JSON and report
        run: |
          set +e
          tuxmedic check --json > out.json
          [ "$?" -le 1 ] || exit 1
          grep -q '"checks"' out.json
          tuxmedic report > report.md
          [ "$?" -le 1 ] || exit 1
          grep -q "tuxmedic report" report.md
