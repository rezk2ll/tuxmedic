# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: tuxmedic

before:
  hooks:
    - mkdir -p dist-extra
    - sh -c "go run ./cmd/tuxmedic completion bash > dist-extra/tuxmedic.bash"
    - sh -c "go run ./cmd/tuxmedic completion zsh > dist-extra/_tuxmedic"
    - sh -c "go run ./cmd/tuxmedic completion fish > dist-extra/tuxmedic.fish"
    - sh -c "go run ./cmd/tuxmedic man | gzip -9n > dist-extra/tuxmedic.1.gz"

builds:
  - main: ./cmd/tuxmedic
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64, riscv64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: dist-extra/*
        dst: extra
        strip_parent: true

nfpms:
  - package_name: tuxmedic
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/rezk2ll/tuxmedic
    maintainer: rezk2ll <6764881+rezk2ll@users.noreply.github.com>
    description: |-
      Finds out what is wrong with your Linux computer and how to fix it.
      tuxmedic checks crashes, Wi-Fi, sound, battery, disks, drivers, sleep,
      memory, temperatures, updates and startup, and explains each problem in
      plain language with the exact fix for your distro.
    license: GPL-3.0-or-later
    section: utils
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/tuxmedic/LICENSE
      - src: dist-extra/tuxmedic.1.gz
        dst: /usr/share/man/man1/tuxmedic.1.gz
      - src: dist-extra/tuxmedic.bash
        dst: /usr/share/bash-completion/completions/tuxmedic
      - src: dist-extra/_tuxmedic
        dst: /usr/share/zsh/site-functions/_tuxmedic
      - src: dist-extra/tuxmedic.fish
        dst: /usr/share/fish/vendor_completions.d/tuxmedic.fish
    archlinux:
      packager: rezk2ll <6764881+rezk2ll@users.noreply.github.com>

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

# Release notes are the annotated tag's message, written by hand.
changelog:
  disable: true

release:
  prerelease: auto
  header: "{{ .TagBody }}"
  footer: |
    ## Verify the download

    ```sh
    cosign verify-blob --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp 'https://github.com/rezk2ll/tuxmedic/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    sha256sum --ignore-missing -c checksums.txt
    ```
